<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pitch & Raga Identifier</title>
  <style>
    :root {
      --bg: #0a0a0a; --card: #151515; --text: #ffffff;
      --acc: #00e5ff; --acc-hover: #00b0ff;
      --btn-bg: #1f1f1f; --border: #333;
      --ff: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ff); }
    body {
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;
    box-sizing: border-box; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--acc); letter-spacing: 1px; text-transform: uppercase; }
    .lang-btn, .theme-btn {
      position: absolute; top: 15px; background: transparent;
      border: 1px solid var(--acc); color: var(--acc);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.3s;
    }
    .lang-btn { right: 15px; }
    .theme-btn { left: 15px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .lang-btn:hover, .theme-btn:hover { background: var(--acc); color: #fff; }

    .pitch-display { text-align: center; margin: 25px 0; padding: 10px; background: #111; border-radius: 10px; border: 2px dashed var(--border); transition: border-color 0.3s; }
    .pitch-display.active { border-color: var(--acc); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
    .big-swara { font-size: 4rem; font-weight: bold; color: var(--acc); margin-bottom: 5px; height: 80px; display: flex; align-items: center; justify-content: center; }
    .hz-val { font-size: 1rem; color: #888; font-family: monospace; }

    .history-box { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; min-height: 80px; }
    .history-title { font-size: 0.8rem; color: #888; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .clear-btn { background: none; border: none; color: var(--acc); cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
    .swara-trace { display: flex; flex-wrap: wrap; gap: 8px; font-size: 1.1rem; font-weight: bold; color: #ddd; }

    .raga-matches { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid var(--border); min-height: 80px; }
    .raga-matches h3 { font-size: 0.9rem; color: #bbb; margin-bottom: 10px; }
    .match-item { background: #222; padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; border-left: 3px solid var(--acc); }
    .match-type { font-size: 0.7rem; color: #888; text-transform: uppercase; background: #333; padding: 2px 6px; border-radius: 4px; }

    .btn-row { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
    .mic-btn { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; background: var(--btn-bg); color: var(--text); border: 1px solid var(--acc); -webkit-tap-highlight-color: transparent; }
    .mic-btn.listening { background: var(--acc); color: #000; box-shadow: 0 0 15px var(--acc); }
    
    .ai-btn:hover, .ai-btn:active { background: #7c3aed; color: #fff; }
    .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .match-item.top-match { font-size: 1.1rem; background: #112211; border-left: 5px solid #76ff03; padding: 12px 15px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(118,255,3,0.1); }
    .match-item.top-match strong { color: #76ff03; font-size: 1.3rem; letter-spacing: 1px; }

    
    
    
    
    
     50%{opacity:0.3;} }

    

    

    /* iOS Safari scroll fix */
    @supports (-webkit-touch-callout: none) {
      body {
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;
    box-sizing: border-box; min-height: -webkit-fill-available; }
    }
  
/* ────────────────────────────────────────
   TRIAL BAR + GO PRO BUTTON
──────────────────────────────────────── */
.trial-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: .7rem; color: #aaa;
  flex-wrap: wrap;
}
.trial-timer {
  font-weight: 800; font-family: monospace; font-size: .92rem;
  color: #ffb74d; min-width: 36px;
}
.trial-bar.expired { background: #d32f2f11; border-color: #d32f2f88; }
.trial-bar.expired .trial-timer { color: #d32f2f; }
.go-pro-btn {
  margin-left: auto;
  padding: 5px 13px;
  border: none; border-radius: 20px;
  background: linear-gradient(135deg,#ffd700,#ffaa00);
  color: #111; font-weight: 900; font-size: .70rem;
  cursor: pointer; white-space: nowrap;
  letter-spacing: .04em;
  box-shadow: 0 0 10px #ffd70099, 0 0 22px #ffd70044;
  animation: gopro-glow 1.8s ease-in-out infinite alternate;
  font-family: inherit;
}
@keyframes gopro-glow {
  0%   { box-shadow: 0 0 8px #ffd700aa, 0 0 18px #ffd70033; }
  100% { box-shadow: 0 0 18px #ffd700ee, 0 0 36px #ffd70088; }
}
.go-pro-btn:hover { filter: brightness(1.15); transform: scale(1.05); }

/* ── Watermark inside card ── */
.wm-card {
  text-align: center; font-size: .56rem; color: #888;
  padding: 8px 0 2px; opacity: .42;
  border-top: 1px solid #333; margin-top: 15px;
  letter-spacing: .05em;
}

</style>
</head>
<body>
<div class="card">
  <button class="theme-btn" id="themeToggle">🎨</button>
  <button class="lang-btn" id="langToggle">ಕನ್ನಡ</button>
  <h1 id="tTitle">Raga Identifier</h1>

    <div class="trial-bar" id="trialBar">
    <span id="trialLbl">⏱ Free Trial:</span>
    <span class="trial-timer" id="trialTimer">120:00</span>
    <span id="trialMsg" style="font-size:.61rem;flex:1">ProMax for unlimited usage coming soon</span>
    <button class="go-pro-btn" id="goProBtn">⭐ Go Pro Max</button>
  </div>

  <div class="pitch-display" id="pitchBox" style="position:relative;overflow:hidden;">
    <canvas id="vizCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0.3;"></canvas>
    <div style="position:relative;z-index:1;">
      <div class="big-swara" id="noteDisp" style="text-shadow:0 4px 10px rgba(0,0,0,0.8);">--</div>
      <div class="hz-val" style="font-size:1.5rem;margin-top:10px;">
        <strong id="swaraDisp" style="color:var(--acc);">-</strong> &nbsp;|&nbsp;
        <span id="hzDisp" style="color:#aaa;">0.0 Hz</span>
      </div>
    </div>
  </div>

  <div class="history-box">
    <div class="history-title">
      <span id="lblTrace">Sung Swaras <span id="rootIndicator" style="color:var(--acc);margin-left:10px;font-weight:bold;"></span></span>
      <button class="clear-btn" id="btnClear">Clear Trace</button>
    </div>
    <div class="swara-trace" id="traceBox"></div>
  </div>

  <div class="raga-matches">
    <h3 id="lblMatches">Possible Ragas</h3>
    <div id="matchList">
      <div style="color:#666;font-size:0.8rem;text-align:center;margin-top:20px;" id="lblNoNotes">Sing into the microphone to identify ragas...</div>
    </div>
  </div>

  <div class="raga-matches" style="margin-top:15px;">
    <h3 id="lblKrithi">Composition (Krithi) Matches</h3>
    <div id="krithiList">
      <div style="color:#666;font-size:0.8rem;text-align:center;margin-top:10px;" id="lblNoKrithi">Sing a longer phrase to identify compositions...</div>
    </div>
  </div>

  

  

  <div class="btn-row">
    <button class="mic-btn" id="btnMic">🎤 Start Microphone</button>
    
  </div>

  

  <div class="wm-card">🎵 By Subrahmanya Sripadu</div>
</div>

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
let actx = null, analyser = null, mediaStream = null;
let isListening = false, animFrame = null;
let buf = new Float32Array(2048);
let sungPitchClasses = new Set();
let traceLog = [];
let lastPitchClass = -1, stableCount = 0, currentRoot = -1;
let pitchHistory = [], swaraHoldTimer = null;
let bestRoot = -1;

// YIN-inspired autocorrelation with improved accuracy
function detectPitch(buffer, sampleRate) {
  const SIZE = buffer.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.0045) return -1;

  // Trimming
  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < 0.2) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buffer[SIZE - i]) < 0.2) { r2 = SIZE - i; break; }
  const trimmed = buffer.slice(r1, r2);
  const tSIZE = trimmed.length;

  // Autocorrelation
  const c = new Float32Array(tSIZE);
  for (let i = 0; i < tSIZE; i++)
    for (let j = 0; j < tSIZE - i; j++)
      c[i] += trimmed[j] * trimmed[j + i];

  let d = 0;
  while (d < tSIZE - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < tSIZE; i++) {
    if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  }
  if (maxpos < 1 || maxpos >= tSIZE - 1) return -1;

  // Parabolic interpolation
  const x1 = c[maxpos - 1], x2 = c[maxpos], x3 = c[maxpos + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  let T0 = a ? maxpos - b / (2 * a) : maxpos;

  return sampleRate / T0;
}

function updatePitch() {
  if (!isListening) return;

  try {
    if (actx && actx.state === 'suspended') {
      actx.resume();
    }

    analyser.getFloatTimeDomainData(buf);

  // Waveform viz
  const canvas = el('vizCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    if (canvas.width !== canvas.offsetWidth) canvas.width = canvas.offsetWidth;
    if (canvas.height !== canvas.offsetHeight) canvas.height = canvas.offsetHeight;
    const byteBuf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(byteBuf);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 3;
    ctx.strokeStyle = document.documentElement.style.getPropertyValue('--acc') || '#00e5ff';
    ctx.beginPath();
    const sliceW = canvas.width / byteBuf.length;
    let x = 0;
    for (let i = 0; i < byteBuf.length; i++) {
      const y = (byteBuf[i] / 128.0) * canvas.height / 2;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      x += sliceW;
    }
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }

  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);

  let rawPitch = rms > 0.0045 ? detectPitch(buf, actx.sampleRate) : -1;
  let pitch = -1;
  if (rawPitch !== -1 && rawPitch >= 50 && rawPitch <= 2000) {
    pitchHistory.push(rawPitch);
    if (pitchHistory.length > 7) pitchHistory.shift();
    const sorted = [...pitchHistory].sort((a, b) => a - b);
    pitch = sorted[Math.floor(sorted.length / 2)];
  } else {
    pitchHistory = [];
  }

  if (pitch !== -1 && pitch >= 50 && pitch <= 2000) {
    const midiNote = Math.round(69 + 12 * Math.log2(pitch / 440));
    const pitchClass = midiNote % 12;

    if (currentRoot === -1) currentRoot = pitchClass;

    const interval = (pitchClass - currentRoot + 12) % 12;
    el('hzDisp').textContent = pitch.toFixed(1) + ' Hz';

    const sNameEn = SWARA_NAMES[interval];
    el('swaraDisp').textContent = lang === 'en' ? sNameEn : (SWARA_KN[sNameEn] || sNameEn);
    el('noteDisp').textContent = WESTERN_NOTES[pitchClass];

    const exactMidiFreq = 440 * Math.pow(2, (midiNote - 69) / 12);
    const cents = 1200 * Math.log2(pitch / exactMidiFreq);
    el('noteDisp').style.color = Math.abs(cents) < 15 ? '#76ff03' : '';

    clearTimeout(swaraHoldTimer);
    swaraHoldTimer = setTimeout(() => {
      if (!isListening) return;
      el('swaraDisp').textContent = '-';
      el('noteDisp').textContent = '--';
      el('noteDisp').style.color = '';
    }, 2000);

    if (pitchClass === lastPitchClass) {
      stableCount++;
      if (stableCount === 4) {
        if (!sungPitchClasses.has(pitchClass) || traceLog[traceLog.length - 1] !== pitchClass) {
          sungPitchClasses.add(pitchClass);
          traceLog.push(pitchClass);
          if (traceLog.length > 24) traceLog.shift();
          updateTraceUI();
          findRagas();
        }
      }
    } else {
      lastPitchClass = pitchClass;
      stableCount = 0;
    }
  } else {
    el('hzDisp').textContent = '0.0 Hz';
    stableCount = 0;
  }

  } catch (e) {
    console.error('updatePitch loop error', e);
  } finally {
    if (isListening) animFrame = requestAnimationFrame(updatePitch);
  }
}

el('btnMic').onclick = async () => {
  if (isListening) {
    isListening = false;
    cancelAnimationFrame(animFrame);
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (actx) { try { actx.close(); } catch(e){} actx = null; }
    el('pitchBox').classList.remove('active');
    el('btnMic').classList.remove('listening');
    el('swaraDisp').textContent = '-';
    el('hzDisp').textContent = '0.0 Hz';
    clearTimeout(swaraHoldTimer);
    applyLang();
    pauseTrialCountdown();
    return;
  }

  try {
    // iOS requires simple constraints; complex constraints fail on Safari iOS
    const constraints = isIOS()
      ? { audio: true }
      : { audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } };

    // Get mic stream first (must be inside user gesture for iOS)
    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

    // Create AudioContext AFTER getUserMedia inside the same user gesture
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    actx = new AudioCtx();

    // iOS Safari suspends AudioContext immediately — must resume it
    if (actx.state === 'suspended') {
      await actx.resume();
    }

    // Adapt buffer size to sample rate
    const fftSize = actx.sampleRate >= 48000 ? 4096 : 2048;
    buf = new Float32Array(fftSize);

    analyser = actx.createAnalyser();
    analyser.fftSize = fftSize;
    analyser.smoothingTimeConstant = 0.72;

    const source = actx.createMediaStreamSource(mediaStream);
    source.connect(analyser);

    if(trialEnded) return;
    isListening = true;
    el('pitchBox').classList.add('active');
    el('btnMic').classList.add('listening');
    startTrialCountdown();
    applyLang();
    updatePitch();

  } catch (e) {
    console.error('Mic Error:', e);
    isListening = false;
    el('pitchBox').classList.remove('active');
    el('btnMic').classList.remove('listening');
    applyLang();

    let msg = 'Microphone access denied or unavailable.\n\nEnsure you\'ve granted microphone permission in browser settings.';
    if (isIOS()) {
      msg = '📱 iOS Microphone Error\n\n• Open Settings → Safari → Microphone → Allow\n• Make sure you\'re using Safari (not Chrome/Firefox) on iOS\n• The page must be served over HTTPS or localhost';
    } else if (window.location.protocol === 'file:') {
      msg = 'Chrome blocks mic for file:// URLs.\n\nUse a local server (e.g. "python3 -m http.server") or host on GitHub Pages.';
    }
    alert(msg);
  }
};

function updateTraceUI() {
  const box = el('traceBox');
  if (box) box.innerHTML = '';
  const ri = el('rootIndicator');
  if (currentRoot === -1) { if (ri) ri.textContent = ''; return; }
  if (ri) ri.textContent = '(Sa = ' + WESTERN_NOTES[currentRoot] + ')';
  traceLog.forEach(pClass => {
    const inter = (pClass - currentRoot + 12) % 12;
    const s = document.createElement('span');

    box.appendChild(s);

el('btnClear').onclick = () => {
  sungPitchClasses.clear();
  traceLog = [];
  currentRoot = -1;
  bestRoot = -1;
  globalKrithis.clear();
  
  updateTraceUI();
  findRagas();
};

function getRagaIntervals(raga, isJanya) {
  const s = new Set();
  if (isJanya) {
    raga.intervalsAro.forEach(x => s.add(x % 12));
    raga.intervalsAva.forEach(x => s.add(x % 12));
  } else {
    raga.intervals.forEach(x => s.add(x % 12));
  }
  return s;
}

function findRagas() {
  const list = el('matchList');
  if (sungPitchClasses.size === 0) {
    list.innerHTML = `<div style="color:#666;font-size:0.8rem;text-align:center;margin-top:20px;">${I18N[lang].noNotes}</div>`;
    renderKrithis();
    return;
  }

  let allMatches = [];

  for (let testRoot = 0; testRoot < 12; testRoot++) {
    const relativeSung = new Set();
    for (let p of sungPitchClasses) relativeSung.add((p - testRoot + 12) % 12);

    const evaluateRaga = (r, type, isJanya) => {
      const allowed = getRagaIntervals(r, isJanya);
      let matchCount = 0, wrongCount = 0;

      for (let item of relativeSung) {
        if (allowed.has(item)) matchCount++;
        else wrongCount++;
      }
      const missing = allowed.size - matchCount;
      const allowedWrong = matchCount >= 5 ? 5 : (matchCount >= 4 ? 3 : 2);

      if (matchCount >= 3 && wrongCount <= allowedWrong) {
        let score = (matchCount * 4) - (wrongCount * 1.5) - (missing * 1.0);

        if (missing === 0) score += 6;
        if (wrongCount === 0) score += 3;

        // --- Sequence awareness bonus ---
        let seqScore = 0;
        if (traceLog.length >= 3) {
          const relTrace = traceLog.map(p => (p - testRoot + 12) % 12);
          const cleanTrace = [];
          for (let t of relTrace) { if(cleanTrace.length === 0 || cleanTrace[cleanTrace.length-1] !== t) cleanTrace.push(t); }

          // Janya ragas have Aro/Ava, Melakarta just has intervals (scale)
          const aro = isJanya ? r.intervalsAro : r.intervals;
          const ava = isJanya ? r.intervalsAva : [...r.intervals].reverse();

          let aroMatch = 0, avaMatch = 0;
          let aIdx = 0, vIdx = 0;
          for (let t of cleanTrace) {
              if (t === (aro[aIdx]%12)) { aroMatch++; aIdx++; if(aIdx >= aro.length) break; }
          }
          // Same for ava, but from the end of the trace might be better, or just any subsequence
          for (let t of cleanTrace) {
              if (t === (ava[vIdx]%12)) { avaMatch++; vIdx++; if(vIdx >= ava.length) break; }
          }

          seqScore = (aroMatch + avaMatch) * 1.5;
        }

        score += seqScore;
        // ---------------------------------

        allMatches.push({
          name: lang === 'en' ? r.en : r.kn,
          nameEn: r.en, type, rootName: WESTERN_NOTES[testRoot],
          matchCount, missing, wrong: wrongCount, score
        });
      }
    };

    RAGAS.forEach(r => evaluateRaga(r, 'Melakarta', false));
    JANYA_RAGAS.forEach(r => evaluateRaga(r, 'Janya', true));
  }

  // Find Krithis across all roots
  if (allMatches.length > 0) {
    globalKrithis.clear();
    for (let r = 0; r < 12; r++) findKrithi(r);
    renderKrithis();
  }

  allMatches.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (a.wrong !== b.wrong) return a.wrong - b.wrong;
    return a.missing - b.missing;
  });

  // Deduplicate
  const uniqueMatches = [];
  const seenNames = new Set();
  for (let m of allMatches) {
    if (!seenNames.has(m.nameEn)) { seenNames.add(m.nameEn); uniqueMatches.push(m); }
  }

  list.innerHTML = '';
  if (uniqueMatches.length === 0) {
    list.innerHTML = `<div style="color:#ff5722;font-size:0.9rem;text-align:center;margin-top:10px;">Keep singing — more notes needed for identification!</div>`;
    return;
  }

  if (uniqueMatches.length > 0 && sungPitchClasses.size >= 3) {
    const topRootName = uniqueMatches[0].rootName;
    bestRoot = WESTERN_NOTES.indexOf(topRootName);
    if (bestRoot === -1) bestRoot = 0;
  } else {
    bestRoot = -1;
  }
  uniqueMatches.slice(0, 4).forEach((m, idx) => {
    const d = document.createElement('div');
    d.className = 'match-item' + (idx === 0 ? ' top-match' : '');

    let infoTxt = '';
    if (m.missing === 0 && m.wrong === 0) infoTxt = '<span style="color:#76ff03;">(Exact Match)</span>';
    else {
      const parts = [];
      if (m.missing > 0) parts.push(`+${m.missing} missing`);
      if (m.wrong > 0) parts.push(`<span style="color:#ff5722;">${m.wrong} wrong</span>`);
      infoTxt = `<span style="color:#888;font-size:0.75rem;">(${parts.join(', ')})</span>`;
    }
    const bulb = idx === 0 ? '<span style="color:#76ff03;text-shadow:0 0 8px #76ff03;margin-right:10px;">🟢</span>' : '';
    d.innerHTML = `<div style="display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;">${bulb}<strong>${m.name}</strong><span style="margin-left:8px;">${infoTxt}</span></div>
      <div style="color:#aaa;font-size:0.8rem;margin-top:4px;margin-left:${idx===0?'26px':'0'};">Calculated Sa = <strong>${m.rootName}</strong></div>
    </div>
    <div class="match-type" style="align-self:flex-start;margin-top:4px;">${m.type}</div>`;
    list.appendChild(d);
  });
}

// ─── KRITHI MATCHING ──────────────────────────────────────────────────────────
let globalKrithis = new Set();

function findKrithi(testRoot) {
  if (traceLog.length < 4) return;
  const relativeTrace = traceLog.map(p => (p - testRoot + 12) % 12);
  KRITHIS.forEach(k => {
    const pattern = k.seq;
    let pIdx = 0;
    for (let i = 0; i < relativeTrace.length; i++) {
      if (relativeTrace[i] === pattern[pIdx]) {
        pIdx++;
        if (pIdx === pattern.length) { globalKrithis.add(k); break; }
      }
    }
  });
}

function renderKrithis() {

  const list = el('krithiList');
  if (!list) return;
  if (globalKrithis.size === 0) {
    const tWait = (lang === 'kn') ? 'ಕೃತಿಗಳನ್ನು ಗುರುತಿಸಲು ಇನ್ನಷ್ಟು ಹಾಡಿ...' : 'Sing a longer phrase to identify compositions...';
    const tNone = (lang === 'kn') ? 'ಯಾವ ಕೃತಿಯೂ ಹೊಂದಿಕೆಯಾಗುತ್ತಿಲ್ಲ.' : 'No compositions matched yet. Keep singing...';
    list.innerHTML = traceLog.length < 4
      ? `<div style="color:#666;font-size:0.8rem;text-align:center;margin-top:10px;" id="lblNoKrithi">${tWait}</div>`
      : `<div style="color:#666;font-size:0.8rem;text-align:center;margin-top:10px;" id="lblNoKrithi">${tNone}</div>`;
    return;
  }
  list.innerHTML = '';
  globalKrithis.forEach(m => {
    const d = document.createElement('div');
    d.className = 'match-item top-match';
    d.style.borderColor = '#00e5ff';
    d.innerHTML = `<div style="display:flex;align-items:center;">
      <span style="color:#00e5ff;text-shadow:0 0 8px #00e5ff;margin-right:10px;">🎵</span>
      <div>
        <strong style="color:#00e5ff;">${m.name}</strong>
        <div style="color:#888;font-size:0.75rem;margin-top:2px;">${m.composer || ''}</div>
      </div>
    </div>
    <div class="match-type" style="background:#003333;color:#00e5ff;border:1px solid #00e5ff;">${m.raga}</div>`;
    list.appendChild(d);
  });
}
